apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-vservice
spec:
  hosts:
  - {{ .Values.host }}.{{ .Values.domain }}
  gateways:
    - {{ .Release.Name }}-gateway
  http:
  - route:
    - destination:
        host: omniparser-service
        port:
          number: 8000
