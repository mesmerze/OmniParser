name: Run Ansible deployment Manually

# Trigger workflow manually using 'workflow_dispatch'
on:  
  workflow_dispatch:
    inputs:
      inventory_file:
        description: "Path to the inventory file"
        required: true
      playbook_file:
        description: "Path to the Ansible playbook file"
        required: true

jobs:
  run-ansible:
    runs-on: testio

    steps:
    # Step 1: Checkout the code repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Setup Python and Ansible
    - name: Install Ansible
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip
        pip3 install ansible
        echo "${HOME}/.local/bin" >> $GITHUB_PATH

    # Step 3: Execute Ansible Playbook
    - name: Run Ansible Playbook
      run: |
        ansible-playbook -i ${{ inputs.inventory_file }} ${{ inputs.playbook_file }}
